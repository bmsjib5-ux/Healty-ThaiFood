services:
  - name: healty-thaifood
    type: web
    runtime: static
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
